name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project & prepare Gradle
        run: |
          unzip -o MochiAuto.zip
          if [ -d "MochiAuto" ]; then cd MochiAuto; fi
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          if [ -d "MochiAuto" ]; then cd MochiAuto; fi
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MochiAuto-v2-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
